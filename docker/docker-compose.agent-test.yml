version: '3.8'

services:
  postgres_test:
    image: postgres:15-alpine
    container_name: langgraph_postgres_test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_agent_test}
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: langgraph_agent_test
    depends_on:
      postgres_test:
        condition: service_healthy
    environment:
      # Database connection
      - POSTGRES_HOST=postgres_test
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph_agent_test}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA:-public}
      # Explicitly set DATABASE URLs to ensure proper connection
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_test:5432/${POSTGRES_DB:-langgraph_agent_test}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_test:5432/${POSTGRES_DB:-langgraph_agent_test}
      # Set a mock API key for testing if not provided
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-mock_api_key_for_testing}
      # Use mock data for testing (in-memory patient/appointment data)
      - USE_MOCK_DATA=false
      # Test-specific settings
      - PYTEST_ADDOPTS="-v"
      - PYTHONPATH=/app
      # Tell pytest this is a test environment
      - ENVIRONMENT=test
      # Log level
      - LOG_LEVEL=DEBUG
    volumes:
      - ..:/app
    command: >
      sh -c "sleep 3 &&
             python init_db.py &&
             python -u -m pytest tests/agent ${PYTEST_ARGS:-} -v"

volumes:
  postgres_test_data:
